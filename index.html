<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VibeGram - Redirecting to Live App</title>
    <meta http-equiv="refresh" content="0; url=https://vibe-gram-ule1.vercel.app/" />
    <style>
      body {
        margin: 0;
        background: #0f172a;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
      }
      .card {
        padding: 2rem;
        border-radius: 1rem;
        background: #1e293b;
        border: 1px solid #334155;
        max-width: 400px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #334155;
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 1.5rem;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      a {
        color: #818cf8;
        text-decoration: none;
        font-weight: 600;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
    <script>
      window.location.replace("https://vibe-gram-ule1.vercel.app/");
    </script>
  </head>
  <body>
    <div class="card">
      <div class="spinner"></div>
      <h2 style="margin: 0 0 0.5rem 0; font-size: 1.25rem;">Launching VibeGram 🚀</h2>
      <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.25rem;">
